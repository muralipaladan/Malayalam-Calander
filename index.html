<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>മലയാളം കലണ്ടർ & പ്ലാനർ</title>
  <meta name="theme-color" content="#b91c1c">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding: 12px; }
    .container { max-width: 480px; margin: auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; }
    header { background: #b91c1c; color: white; padding: 16px; text-align: center; }
    .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .kerala-date-head { font-size: 13px; opacity: 0.9; }
    
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #f1f5f9; text-align: center; font-weight: bold; font-size: 12px; padding: 8px 0; }
    .weekdays div:first-child { color: #dc2626; }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px; }
    .day-cell { border: 1px solid #e2e8f0; border-radius: 8px; min-height: 54px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 2px; text-align: center; cursor: pointer; font-size: 11px; position: relative; background: #fff; }
    .day-cell.selected { border: 2px solid #b91c1c; background: #fef2f2; font-weight: bold; }
    .day-cell.other-month { opacity: 0.25; }
    .day-num { font-size: 14px; font-weight: 600; }
    .mal-num { font-size: 10px; color: #7c2d12; font-weight: bold; }
    .star-name { font-size: 9px; color: #475569; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .dot-badge { width: 5px; height: 5px; background: #b91c1c; border-radius: 50%; position: absolute; top: 3px; right: 3px; }

    .details-panel { border-top: 2px solid #f1f5f9; padding: 16px; }
    .panchangam-box { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
    
    .btn-group-export { display: flex; gap: 6px; margin-bottom: 12px; }
    .btn-export { flex: 1; background: #047857; color: white; font-weight: 600; border: none; padding: 8px; border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center; }
    .btn-export-year { background: #0f172a; }

    .section-title { font-size: 13px; font-weight: 700; color: #475569; margin: 10px 0 6px; }
    input, textarea, button { width: 100%; border-radius: 6px; border: 1px solid #cbd5e1; padding: 8px; font-size: 13px; }
    textarea { resize: vertical; min-height: 60px; }
    
    .btn-main { background: #b91c1c; color: white; font-weight: 600; border: none; margin-top: 6px; cursor: pointer; }
    .file-chip { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 6px 10px; border-radius: 6px; margin-top: 6px; font-size: 12px; }
    .rem-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-left: 3px solid #b91c1c; padding: 6px 8px; margin-top: 4px; font-size: 12px; }
    .del-btn { color: #dc2626; cursor: pointer; font-weight: bold; border: none; background: transparent; width: auto; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="month-header">
      <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
      <div>
        <h2 id="engMonthYear"></h2>
        <div class="kerala-date-head" id="malMonthYear"></div><div class="kerala-date-head" id="locationInfo"></div>
      </div>
      <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>
  </header>

  <div class="weekdays">
    <div>ഞായർ</div><div>തിങ്കൾ</div><div>ചൊവ്വ</div><div>ബുധൻ</div><div>വ്യാഴം</div><div>വെള്ളി</div><div>ശനി</div>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

  <div class="details-panel">
    <div class="panchangam-box" id="panchangamInfo"></div>

    <div class="btn-group-export">
      <button class="btn-export" onclick="exportCurrentMonthICS()">📥 ഈ മാസം Export (.ics)</button>
      <button class="btn-export btn-export-year" onclick="exportCurrentYearICS()">📅 ഈ വർഷം മുഴുവൻ Export (.ics)</button>
    </div>

    <div class="section-title">റീമൈൻഡറുകൾ / ടാസ്കുകൾ</div>
    <div style="display: flex; gap: 6px;">
      <input type="text" id="remInput" placeholder="റീമൈൻഡർ ടൈപ്പ് ചെയ്യുക...">
      <button class="btn-main" style="width: 70px; margin-top:0;" onclick="addReminder()">Add</button>
    </div>
    <div id="reminderList"></div>

    <div class="section-title">കുറിപ്പുകൾ (Notes)</div>
    <textarea id="noteInput" placeholder="ഈ ദിവസത്തെ കുറിപ്പുകൾ ഇവിടെ എഴുതാം..."></textarea>
    <button class="btn-main" onclick="saveNote()">Save Note</button>

    <div class="section-title">ഫയൽ അറ്റാച്ച്‌മെന്റുകൾ</div>
    <input type="file" id="fileInput" onchange="uploadFile()">
    <div id="fileList"></div>
  </div>
</div>

<script>
  const stars = ["അശ്വതി","ഭരണി","കാർത്തിക","രോഹിണി","മകയിരം","തിരുവാതിര","പുണർതം","പൂയം","ആയില്യം","മകം","പൂരം","ഉത്രം","അത്തം","ചിത്തിര","ചോതി","വിശാഖം","അനിഴം","തൃക്കേട്ട","മൂലം","പൂരാടം","ഉത്രാടം","തിരുവോണം","അവിട്ടം","ചതയം","പൂരുരുട്ടാതി","ഉത്രട്ടാതി","രേവതി"];
  const malMonths = ["മേടം","ഇടവം","മിഥുനം","കർക്കടകം","ചിങ്ങം","കന്നി","തുലാം","വൃശ്ചികം","ധനു","മകരം","കുംഭം","മീനം"];
  
  let currDate = new Date();
  let selectedDateStr = new Date().toISOString().split('T')[0];
  let db;
  const CAL_LAT=11.226834296966167;
  const CAL_LON=76.2155041702179;
  const CAL_TZ='Asia/Kolkata';

  const request = indexedDB.open("MalayalamCalendarDB", 1);
  request.onupgradeneeded = e => {
    db = e.target.result;
    if(!db.objectStoreNames.contains("entries")) {
      db.createObjectStore("entries", { keyPath: "date" });
    }
  };
  request.onsuccess = e => {
    db = e.target.result;
    renderCalendar();
    loadDateData(selectedDateStr);
  };

  function localDateString(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function dateFromString(s) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function degNorm(x) { return ((x % 360) + 360) % 360; }

  // Low-precision astronomical solar longitude.
  // Malayalam month is based on the Sun's sidereal zodiac position.
  function solarTropicalLongitude(date) {
    const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
    const h=date.getHours()+date.getMinutes()/60+date.getSeconds()/3600;
    const dt=(Date.UTC(y,m-1,d,h)-Date.UTC(2000,0,1,12))/86400000;
    const L=degNorm(280.460+0.9856474*dt);
    const g=degNorm(357.528+0.9856003*dt)*Math.PI/180;
    return degNorm(L+1.915*Math.sin(g)+0.020*Math.sin(2*g));
  }

  function moonTropicalLongitude(date) {
    const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
    const h=date.getHours()+date.getMinutes()/60+date.getSeconds()/3600;
    const dt=(Date.UTC(y,m-1,d,h)-Date.UTC(2000,0,1,12))/86400000;
    const L=degNorm(218.316+13.176396*dt);
    const M=degNorm(134.963+13.064993*dt)*Math.PI/180;
    const F=degNorm(93.272+13.229350*dt)*Math.PI/180;
    return degNorm(L+6.289*Math.sin(M)-3.858*Math.sin((L-134.963)*Math.PI/180)
      +0.214*Math.sin(2*M)-0.110*Math.sin(F));
  }

  function approxAyanamsa(date) {
    const y=date.getFullYear()+(date.getMonth()+1-0.5)/12;
    return 23.8530556+0.013968*(y-2000);
  }

  function siderealSun(date) {
    return degNorm(solarTropicalLongitude(date)-approxAyanamsa(date));
  }

  function siderealMoon(date) {
    return degNorm(moonTropicalLongitude(date)-approxAyanamsa(date));
  }

  function expectedSankrantiMonth(rashiIndex) {
    // 0=Mesha (Apr), ... 3=Karkidakam (Jul),
    // 4=Simha (Aug), ... 11=Meena (Mar).
    return rashiIndex <= 3 ? rashiIndex + 3 : rashiIndex - 4 + 7;
  }

  function sankrantiApprox(year, rashiIndex) {
    let month = expectedSankrantiMonth(rashiIndex);
    let searchYear = year;

    // JS month is 0-based. Meena (11) occurs in March of the following
    // Gregorian year, while Mesha-Karkidakam occur Apr-Jul.
    if (rashiIndex >= 11) searchYear = year + 1;

    const start = new Date(searchYear, month, 1);
    const end = new Date(searchYear, month + 1, 10);
    const target = rashiIndex * 30;
    let best=start, bestErr=Infinity;

    for(let t=start.getTime(); t<=end.getTime(); t+=3*60*60*1000) {
      const dt=new Date(t);
      const lonNow=siderealSun(dt);
      const diff=Math.abs(((lonNow-target+180)%360)-180);
      if(diff<bestErr) { best=dt; bestErr=diff; }
    }
    return best;
  }

  // Location-specific sunrise/sunset using the standard NOAA solar
  // approximation. The calendar date itself remains the Kerala solar date,
  // while daily panchanga day boundaries use the supplied coordinates.
  function solarEvent(date, isSunrise) {
    const y=date.getFullYear(), m=date.getMonth(), d=date.getDate();
    const N=Math.floor((Date.UTC(y,m,d)-Date.UTC(y,0,0))/86400000);
    const lngHour=CAL_LON/15;
    const zenith=90.8333;
    const t=N+((isSunrise?6:18)-lngHour)/24;
    const M=(0.9856*t)-3.289;
    let L=M+(1.916*Math.sin(M*Math.PI/180))+
      (0.020*Math.sin(2*M*Math.PI/180))+282.634;
    L=degNorm(L);
    let RA=Math.atan(0.91764*Math.tan(L*Math.PI/180))*180/Math.PI;
    RA=degNorm(RA);
    const Lquadrant=Math.floor(L/90)*90;
    const RAquadrant=Math.floor(RA/90)*90;
    RA=(RA+(Lquadrant-RAquadrant))/15;
    const sinDec=0.39782*Math.sin(L*Math.PI/180);
    const cosDec=Math.cos(Math.asin(sinDec));
    const cosH=(Math.cos(zenith*Math.PI/180)-
      sinDec*Math.sin(CAL_LAT*Math.PI/180))/
      (cosDec*Math.cos(CAL_LAT*Math.PI/180));
    if(cosH>1 || cosH<-1) return null;
    let H=(isSunrise ? 360-Math.acos(cosH)*180/Math.PI :
      Math.acos(cosH)*180/Math.PI)/15;
    const T=H+RA-(0.06571*t)-6.622;
    let UT=(T-lngHour)%24; if(UT<0) UT+=24;
    // UTC -> IST
    const istHours=UT+5.5;
    const localHours=((istHours%24)+24)%24;
    const hh=Math.floor(localHours);
    const mm=Math.floor((localHours-hh)*60);
    return {hh,mm};
  }

  function fmtTime(t) {
    return t ? `${String(t.hh).padStart(2,'0')}:${String(t.mm).padStart(2,'0')}` : '--:--';
  }

  function getMalayalamInfo(date) {
    const sun=siderealSun(date);
    const monthIndex=Math.floor(sun/30);
    let monthStart=sankrantiApprox(date.getFullYear(), monthIndex);

    if(monthStart > date) {
      monthStart=sankrantiApprox(date.getFullYear()-1, monthIndex);
    }

    const dateOnly=new Date(date.getFullYear(),date.getMonth(),date.getDate());
    const startOnly=new Date(monthStart.getFullYear(),monthStart.getMonth(),monthStart.getDate());
    const malDate=Math.floor((dateOnly-startOnly)/86400000)+1;

    const moon=siderealMoon(date);
    const starIndex=Math.min(26,Math.floor(moon/(360/27)));

    const chingamStart=sankrantiApprox(date.getFullYear(),4);
    const kollavarsham=date >= chingamStart ? date.getFullYear()-824 : date.getFullYear()-825;

    return {
      star:stars[starIndex],
      malDate:Math.max(1,malDate),
      malMonth:malMonths[monthIndex],
      kollavarsham,
      sunrise:solarEvent(date,true),
      sunset:solarEvent(date,false)
    };
  }

  function renderCalendar() {
    const year=currDate.getFullYear();
    const month=currDate.getMonth();

    document.getElementById('engMonthYear').innerText =
      currDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});

    const midInfo=getMalayalamInfo(new Date(year,month,15));
    document.getElementById('malMonthYear').innerText =
      `കൊല്ലവർഷം ${midInfo.kollavarsham} ${midInfo.malMonth}`;

    const firstDay=new Date(year,month,1).getDay();
    const lastDate=new Date(year,month+1,0).getDate();
    const grid=document.getElementById('calendarGrid');
    const frag=document.createDocumentFragment();

    for(let i=0;i<firstDay;i++){
      const el=document.createElement('div');
      el.className='day-cell other-month';
      frag.appendChild(el);
    }

    const dates=[];
    for(let day=1;day<=lastDate;day++){
      const d=new Date(year,month,day);
      const dStr=localDateString(d);
      const malInfo=getMalayalamInfo(d);
      const cell=document.createElement('div');

      cell.className=`day-cell ${dStr===selectedDateStr?'selected':''}`;
      cell.id=`cell-${dStr}`;
      cell.innerHTML=`
        <div class="day-num">${day}</div>
        <div class="mal-num">${malInfo.malDate}</div>
        <div class="star-name">${malInfo.star}</div>
        <span class="dot-badge" id="dot-${dStr}" style="display:none"></span>`;
      cell.onclick=()=>selectDate(dStr);

      frag.appendChild(cell);
      dates.push(dStr);
    }

    grid.replaceChildren(frag);
    dates.forEach(checkDot);
  }

  function changeMonth(step) {
    currDate = new Date(currDate.getFullYear(), currDate.getMonth()+step, 1);
    renderCalendar();
  }

  function selectDate(dStr) {
    selectedDateStr = dStr;
    renderCalendar();
    loadDateData(dStr);
  }

  function loadDateData(dStr) {
    const d = dateFromString(dStr);
    const m = getMalayalamInfo(d);
    document.getElementById('panchangamInfo').innerHTML = `
      <strong>${d.toDateString()}</strong><br>
      മലയാള തീയതി: ${m.kollavarsham} ${m.malMonth} ${m.malDate}<br>
      നക്ഷത്രം: <strong>${m.star}</strong><br>
      സൂര്യോദയം: <strong>${fmtTime(m.sunrise)}</strong> &nbsp;
      സൂര്യാസ്തമയം: <strong>${fmtTime(m.sunset)}</strong>
    `;

    const tx = db.transaction("entries", "readonly");
    const req = tx.objectStore("entries").get(dStr);
    req.onsuccess = () => {
      const data = req.result || { notes: '', reminders: [], files: [] };
      document.getElementById('noteInput').value = data.notes || '';
      renderReminders(data.reminders || []);
      renderFiles(data.files || []);
    };
  }

  function getEntry(cb) {
    const tx = db.transaction("entries", "readwrite");
    const store = tx.objectStore("entries");
    const req = store.get(selectedDateStr);
    req.onsuccess = () => {
      let data = req.result || { date: selectedDateStr, notes: '', reminders: [], files: [] };
      cb(data, store);
    };
  }

  function saveNote() {
    getEntry((data, store) => {
      data.notes = document.getElementById('noteInput').value;
      store.put(data);
      alert('Note saved!');
      checkDot(selectedDateStr);
    });
  }

  function addReminder() {
    const txt = document.getElementById('remInput').value;
    if(!txt) return;
    getEntry((data, store) => {
      data.reminders.push(txt);
      store.put(data);
      document.getElementById('remInput').value = '';
      renderReminders(data.reminders);
      checkDot(selectedDateStr);
    });
  }

  function deleteReminder(idx) {
    getEntry((data, store) => {
      data.reminders.splice(idx, 1);
      store.put(data);
      renderReminders(data.reminders);
      checkDot(selectedDateStr);
    });
  }

  function uploadFile() {
    const file = document.getElementById('fileInput').files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      getEntry((data, store) => {
        data.files.push({ name: file.name, data: reader.result });
        store.put(data);
        renderFiles(data.files);
        checkDot(selectedDateStr);
      });
    };
    reader.readAsDataURL(file);
  }

  function deleteFile(idx) {
    getEntry((data, store) => {
      data.files.splice(idx, 1);
      store.put(data);
      renderFiles(data.files);
      checkDot(selectedDateStr);
    });
  }

  function renderReminders(list) {
    const cont = document.getElementById('reminderList');
    cont.innerHTML = list.map((r, i) => `
      <div class="rem-item">
        <span>📌 ${r}</span>
        <button class="del-btn" onclick="deleteReminder(${i})">✕</button>
      </div>
    `).join('');
  }

  function renderFiles(list) {
    const cont = document.getElementById('fileList');
    cont.innerHTML = list.map((f, i) => `
      <div class="file-chip">
        <a href="${f.data}" download="${f.name}">📄 ${f.name}</a>
        <button class="del-btn" onclick="deleteFile(${i})">✕</button>
      </div>
    `).join('');
  }

  function checkDot(dStr) {
    if(!db) return;
    const tx = db.transaction("entries", "readonly");
    const req = tx.objectStore("entries").get(dStr);
    req.onsuccess = () => {
      const d = req.result;
      const dot = document.getElementById(`dot-${dStr}`);
      if(dot) {
        const hasContent = d && (d.notes || (d.reminders && d.reminders.length) || (d.files && d.files.length));
        dot.style.display = hasContent ? 'block' : 'none';
      }
    };
  }

  // 1. Export Current Month
  async function exportCurrentMonthICS() {
    const year=currDate.getFullYear();
    const month=currDate.getMonth();
    const lastDate=new Date(year,month+1,0).getDate();

    const allEntries=await getAllEntries();
    const entryMap={};
    allEntries.forEach(e=>entryMap[e.date]=e);

    let icsContent="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Malayalam Calendar PWA//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";

    for(let day=1;day<=lastDate;day++){
      const d=new Date(year,month,day);
      const dStr=localDateString(d);
      const mInfo=getMalayalamInfo(d);
      let desc=`കൊല്ലവർഷം: ${mInfo.kollavarsham} ${mInfo.malMonth} ${mInfo.malDate}\\nനക്ഷത്രം: ${mInfo.star}`;
      const entry=entryMap[dStr];

      if(entry?.notes) desc+=`\\nകുറിപ്പ്: ${entry.notes.replace(/\n/g,'\\n')}`;
      if(entry?.reminders?.length) desc+=`\\nറീമൈൻഡറുകൾ: ${entry.reminders.join(', ')}`;

      const nextDate=new Date(year,month,day+1);
      const isoStart=dateICS(d);
      const isoEnd=dateICS(nextDate);

      icsContent+="BEGIN:VEVENT\n";
      icsContent+=`UID:malcal-${dStr}@pwa.local\n`;
      icsContent+=`DTSTART;VALUE=DATE:${isoStart}\n`;
      icsContent+=`DTEND;VALUE=DATE:${isoEnd}\n`;
      icsContent+=`SUMMARY:${mInfo.malMonth} ${mInfo.malDate} - ${mInfo.star}\n`;
      icsContent+=`DESCRIPTION:${icsEscape(desc)}\n`;
      icsContent+="END:VEVENT\n";
    }

    icsContent+="END:VCALENDAR";
    downloadICSFile(icsContent,`Malayalam_Calendar_${year}_${month+1}.ics`);
  }

  // 2. Export Entire Year
  async function exportCurrentYearICS() {
    const year=currDate.getFullYear();
    const allEntries=await getAllEntries();
    const entryMap={};
    allEntries.forEach(e=>entryMap[e.date]=e);

    let icsContent="BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Malayalam Calendar Full Year//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";

    for(let m=0;m<12;m++){
      const lastDay=new Date(year,m+1,0).getDate();
      for(let d=1;d<=lastDay;d++){
        const date=new Date(year,m,d);
        const dStr=localDateString(date);
        icsContent+=makeEvent(date,entryMap[dStr]);
      }
    }

    icsContent+="END:VCALENDAR";
    downloadICSFile(icsContent,`Malayalam_Calendar_FullYear_${year}.ics`);
  }

  function getAllEntries() {
    return new Promise((resolve,reject)=>{
      const req=db.transaction("entries","readonly").objectStore("entries").getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    });
  }

  function dateICS(d) {
    return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  }

  function icsEscape(s) {
    return String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
  }

  function makeEvent(d,entry) {
    const m=getMalayalamInfo(d);
    const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    let desc=`കൊല്ലവർഷം: ${m.kollavarsham} ${m.malMonth} ${m.malDate}\\nനക്ഷത്രം: ${m.star}`;

    if(entry?.notes) desc+=`\\nകുറിപ്പ്: ${entry.notes}`;
    if(entry?.reminders?.length) desc+=`\\nറീമൈൻഡറുകൾ: ${entry.reminders.join(', ')}`;

    return `BEGIN:VEVENT\nUID:malcal-${localDateString(d)}@pwa.local\nDTSTART;VALUE=DATE:${dateICS(d)}\nDTEND;VALUE=DATE:${dateICS(next)}\nSUMMARY:${icsEscape(m.malMonth+' '+m.malDate+' - '+m.star)}\nDESCRIPTION:${icsEscape(desc)}\nEND:VEVENT\n`;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
    });
  }

  function downloadICSFile(content, filename) {
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute('download', filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
</body>
